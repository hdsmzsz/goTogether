syntax = "proto3";

package user;
option go_package = "github.com/spike/goTogether/proto/user";

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetUser(GetUserRequest) returns (UserInfo);
  rpc UpdateUser(UpdateUserRequest) returns (UserInfo);
  rpc LookupByUsername(LookupByUsernameRequest) returns (UserInfo);
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  int64 user_id = 1;
  string token = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  int64 user_id = 1;
  string token = 2;
  string username = 3;
}

message GetUserRequest {
  int64 user_id = 1;
}

message UpdateUserRequest {
  int64 user_id = 1;
  string username = 2;
  string avatar_url = 3;
}

message UserInfo {
  int64 user_id = 1;
  string username = 2;
  string email = 3;
  string avatar_url = 4;
  string created_at = 5;
}

message LookupByUsernameRequest {
  string username = 1;
}
