<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goTogether Editor (Yjs CRDT)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; }
        .toolbar { background: #2563eb; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .toolbar a { color: white; text-decoration: none; font-size: 14px; }
        .toolbar h2 { font-size: 18px; }
        .status-bar { background: #e2e8f0; padding: 8px 24px; display: flex; gap: 16px; font-size: 13px; color: #64748b; }
        #editor { max-width: 800px; width: 100%; margin: 24px auto; min-height: 600px; background: white; padding: 48px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); outline: none; font-size: 16px; line-height: 1.8; font-family: inherit; resize: vertical; border: none; display: block; }
        .editor-wrap { max-width: 800px; margin: 24px auto; }
        .ws-status { display: inline-flex; align-items: center; gap: 4px; }
        .ws-dot { width: 8px; height: 8px; border-radius: 50%; }
        .ws-connected { background: #22c55e; }
        .ws-disconnected { background: #ef4444; }
        .btn-save { padding: 6px 16px; background: white; color: #2563eb; border: 1px solid white; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
        .btn-save:hover { background: #dbeafe; }
        .btn-save:active { transform: scale(0.96); }
        .btn-save.saving { opacity: 0.6; pointer-events: none; }
        .btn-save.saved { background: #22c55e; color: white; border-color: #22c55e; }
        .save-hint { color: rgba(255,255,255,0.7); font-size: 12px; }
        .btn-share { padding: 6px 16px; background: transparent; color: white; border: 1px solid rgba(255,255,255,0.5); border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
        .btn-share:hover { background: rgba(255,255,255,0.15); border-color: white; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 12px; padding: 24px; width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .modal h3 { margin-bottom: 16px; font-size: 18px; color: #1e293b; }
        .modal input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .modal .btn-primary { padding: 8px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .modal .btn-primary:hover { background: #1d4ed8; }
        .modal .btn-cancel { padding: 8px 20px; background: #f1f5f9; color: #475569; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .share-msg { font-size: 13px; margin-bottom: 8px; padding: 8px; border-radius: 6px; }
        .share-msg.ok { background: #d1fae5; color: #065f46; }
        .share-msg.err { background: #fee2e2; color: #991b1b; }
        .crdt-badge { background: rgba(34,197,94,0.2); color: #166534; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div style="display:flex;align-items:center;gap:16px;">
            <a href="/static/index.html">< Back</a>
            <h2 id="docTitle">Loading...</h2>
            <span class="crdt-badge">Yjs CRDT</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
            <button class="btn-share" onclick="openShareModal()">Share</button>
            <button class="btn-save" id="saveBtn" onclick="saveDoc()">Save</button>
            <span class="save-hint" id="saveHint">Cmd+S</span>
            <div class="ws-status">
                <span class="ws-dot" id="wsDot"></span>
                <span id="wsLabel">Connecting...</span>
            </div>
        </div>
    </div>
    <div class="status-bar">
        <span id="syncInfo">Yjs: 0 updates applied · 0 sent</span>
        <span id="docInfo" style="margin-left:auto;color:#94a3b8;font-family:monospace;font-size:11px;"></span>
    </div>
    <div class="editor-wrap">
        <textarea id="editor" placeholder="Start typing... (collaborative via Yjs)"></textarea>
    </div>

    <div class="modal-overlay" id="shareModal">
        <div class="modal">
            <h3>Share Document</h3>
            <div id="shareMsg" class="share-msg" style="display:none;"></div>
            <input type="text" id="shareUsername" placeholder="Enter username to share with...">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeShareModal()">Cancel</button>
                <button class="btn-primary" onclick="shareDoc()">Share</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as Y from 'https://cdn.jsdelivr.net/npm/yjs@13.6.20/+esm';

        const params = new URLSearchParams(window.location.search);
        const docId = params.get('id');
        const token = localStorage.getItem('token');
        const API = window.location.origin + '/api/v1';
        const WS_URL = 'ws://' + window.location.hostname + ':8082/ws?doc_id=' + docId;

        const ydoc = new Y.Doc();
        const ytext = ydoc.getText('content');
        const editor = document.getElementById('editor');

        let ws = null;
        let lastValue = '';
        let updatesApplied = 0;
        let updatesSent = 0;

        function uint8ToBase64(arr) {
            let bin = '';
            for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
            return btoa(bin);
        }
        function base64ToUint8(b64) {
            const bin = atob(b64);
            const arr = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return arr;
        }
        function updateStatus() {
            document.getElementById('syncInfo').textContent =
                `Yjs: ${updatesApplied} updates applied · ${updatesSent} sent · doc state ${Y.encodeStateAsUpdate(ydoc).length}B`;
            document.getElementById('docInfo').textContent =
                `doc=${docId} · ws=${ws ? ['CONNECTING','OPEN','CLOSING','CLOSED'][ws.readyState] : 'NULL'}`;
        }
        console.log('[Yjs editor] booted, docId=', docId, 'WS=', WS_URL);

        ydoc.on('update', (update, origin) => {
            if (origin === 'remote') return;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({type: 'update', payload: uint8ToBase64(update)}));
                updatesSent++;
                console.log('[Yjs] sent local update', update.length, 'bytes');
                updateStatus();
            } else {
                console.warn('[Yjs] local edit but WS not open, state=', ws?.readyState);
            }
        });

        ytext.observe(() => {
            const newValue = ytext.toString();
            if (newValue === editor.value) return;
            const cursorPos = editor.selectionStart;
            const wasAtEnd = cursorPos === editor.value.length;
            editor.value = newValue;
            lastValue = newValue;
            const newPos = wasAtEnd ? newValue.length : Math.min(cursorPos, newValue.length);
            editor.setSelectionRange(newPos, newPos);
            updateStatus();
        });

        editor.addEventListener('input', () => {
            const newValue = editor.value;
            if (newValue === lastValue) return;
            let prefix = 0;
            while (prefix < lastValue.length && prefix < newValue.length
                   && lastValue[prefix] === newValue[prefix]) prefix++;
            let suffix = 0;
            while (suffix < lastValue.length - prefix && suffix < newValue.length - prefix
                   && lastValue[lastValue.length - 1 - suffix] === newValue[newValue.length - 1 - suffix]) suffix++;
            const deleted = lastValue.length - prefix - suffix;
            const inserted = newValue.substring(prefix, newValue.length - suffix);
            ydoc.transact(() => {
                if (deleted > 0) ytext.delete(prefix, deleted);
                if (inserted.length > 0) ytext.insert(prefix, inserted);
            });
            lastValue = newValue;
        });

        async function loadDoc() {
            try {
                const res = await fetch(API + '/docs/' + docId, {
                    headers: {'Authorization': 'Bearer ' + token},
                });
                const doc = await res.json();
                document.getElementById('docTitle').textContent = doc.title || 'Untitled';
            } catch (e) {
                console.error('load doc:', e);
            }
        }

        function connectWS() {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => {
                document.getElementById('wsDot').className = 'ws-dot ws-connected';
                document.getElementById('wsLabel').textContent = 'Connected';
                const state = Y.encodeStateAsUpdate(ydoc);
                if (state.length > 2) {
                    ws.send(JSON.stringify({type: 'update', payload: uint8ToBase64(state)}));
                }
            };
            ws.onclose = () => {
                document.getElementById('wsDot').className = 'ws-dot ws-disconnected';
                document.getElementById('wsLabel').textContent = 'Disconnected';
                setTimeout(connectWS, 3000);
            };
            ws.onmessage = (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'sync' && Array.isArray(msg.updates)) {
                        console.log('[Yjs] received sync with', msg.updates.length, 'updates');
                        let skipped = 0;
                        for (const u of msg.updates) {
                            try {
                                Y.applyUpdate(ydoc, base64ToUint8(u), 'remote');
                                updatesApplied++;
                            } catch (e2) {
                                skipped++;
                            }
                        }
                        if (skipped > 0) console.warn('[Yjs] skipped', skipped, 'invalid updates (legacy data)');
                        updateStatus();
                    } else if (msg.type === 'update' && msg.payload) {
                        console.log('[Yjs] received remote update');
                        try {
                            Y.applyUpdate(ydoc, base64ToUint8(msg.payload), 'remote');
                            updatesApplied++;
                        } catch (e2) {
                            console.warn('[Yjs] skipped invalid remote update:', e2.message);
                        }
                        updateStatus();
                    }
                } catch (err) {
                    console.error('ws message:', err);
                }
            };
            ws.onerror = (err) => console.error('[Yjs] WS error:', err);
        }

        async function saveDoc() {
            const btn = document.getElementById('saveBtn');
            const hint = document.getElementById('saveHint');
            btn.className = 'btn-save saving';
            btn.textContent = 'Saving...';
            try {
                const res = await fetch(API + '/docs/' + docId, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token,
                    },
                    body: JSON.stringify({content: editor.value}),
                });
                if (res.ok) {
                    btn.className = 'btn-save saved';
                    btn.textContent = 'Saved';
                    hint.textContent = '';
                    setTimeout(() => {
                        btn.className = 'btn-save';
                        btn.textContent = 'Save';
                        hint.textContent = 'Cmd+S';
                    }, 2000);
                } else {
                    btn.className = 'btn-save';
                    btn.textContent = 'Save';
                }
            } catch (e) {
                btn.className = 'btn-save';
                btn.textContent = 'Save';
            }
        }

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                e.preventDefault();
                saveDoc();
            }
        });

        window.openShareModal = () => {
            document.getElementById('shareModal').classList.add('active');
            document.getElementById('shareUsername').value = '';
            document.getElementById('shareMsg').style.display = 'none';
            document.getElementById('shareUsername').focus();
        };
        window.closeShareModal = () => {
            document.getElementById('shareModal').classList.remove('active');
        };
        window.saveDoc = saveDoc;
        window.shareDoc = async () => {
            const username = document.getElementById('shareUsername').value.trim();
            if (!username) return;
            const msgEl = document.getElementById('shareMsg');
            try {
                const res = await fetch(API + '/docs/' + docId + '/share', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token,
                    },
                    body: JSON.stringify({username}),
                });
                const data = await res.json();
                if (res.ok) {
                    msgEl.textContent = 'Shared with ' + data.collaborator;
                    msgEl.className = 'share-msg ok';
                } else {
                    msgEl.textContent = data.error || 'Share failed';
                    msgEl.className = 'share-msg err';
                }
                msgEl.style.display = 'block';
            } catch (e) {
                msgEl.textContent = 'Network error: ' + e.message;
                msgEl.className = 'share-msg err';
                msgEl.style.display = 'block';
            }
        };

        document.getElementById('shareModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('shareModal')) closeShareModal();
        });

        loadDoc().then(() => connectWS());
    </script>
</body>
</html>
